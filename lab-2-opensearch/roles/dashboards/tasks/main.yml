---
- name: Download package to control machine
  ansible.builtin.get_url:
    url: "{{ dashboards_deb_url }}"
    dest: "{{ artifacts_dir }}/{{ dashboards_deb }}"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: Package cache dir
  ansible.builtin.file:
    path: "{{ remote_artifacts_dir }}"
    state: directory
    mode: "0755"

- name: Copy package
  ansible.builtin.copy:
    src: "{{ artifacts_dir }}/{{ dashboards_deb }}"
    dest: "{{ remote_artifacts_dir }}/{{ dashboards_deb }}"
    mode: "0644"

- name: Install opensearch-dashboards
  ansible.builtin.apt:
    deb: "{{ remote_artifacts_dir }}/{{ dashboards_deb }}"

- name: Certificates dir
  ansible.builtin.file:
    path: "{{ dashboards_conf_dir }}/certs"
    state: directory
    owner: opensearch-dashboards
    group: opensearch-dashboards
    mode: "0750"

- name: Certificates
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item.src }}"
    dest: "{{ dashboards_conf_dir }}/certs/{{ item.dest }}"
    owner: opensearch-dashboards
    group: opensearch-dashboards
    mode: "{{ item.mode }}"
  loop:
    - {src: ca.pem, dest: ca.pem, mode: "0644"}
    - {src: "{{ inventory_hostname }}.pem", dest: dashboards.pem, mode: "0644"}
    - {src: "{{ inventory_hostname }}.key", dest: dashboards.key, mode: "0600"}
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart dashboards

- name: Config opensearch_dashboards.yml
  ansible.builtin.template:
    src: opensearch_dashboards.yml.j2
    dest: "{{ dashboards_conf_dir }}/opensearch_dashboards.yml"
    owner: root
    group: opensearch-dashboards
    mode: "0640"
  notify: Restart dashboards

- name: Enable and start dashboards
  ansible.builtin.systemd_service:
    name: opensearch-dashboards
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for Dashboards
  ansible.builtin.uri:
    url: "https://{{ inventory_hostname }}:{{ dashboards_port }}/api/status"
    user: "{{ admin_user }}"
    password: "{{ admin_password }}"
    force_basic_auth: true
    ca_path: "{{ ca_cert_path }}"
  register: dashboards_status
  retries: 30
  delay: 5
  until: dashboards_status.status == 200 and dashboards_status.json.status.overall.state == 'green'
