---
- name: Kernel settings
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-opensearch.conf
  loop:
    - {name: vm.max_map_count, value: "262144"}
    - {name: vm.swappiness, value: "1"}

- name: Download packages to control machine
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ artifacts_dir }}/{{ item.file }}"
    mode: "0644"
  loop:
    - {url: "{{ opensearch_deb_url }}", file: "{{ opensearch_deb }}"}
    - {url: "{{ opensearch_exporter_url }}", file: "{{ opensearch_exporter_zip }}"}
  loop_control:
    label: "{{ item.file }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Package cache dir
  ansible.builtin.file:
    path: "{{ remote_artifacts_dir }}"
    state: directory
    mode: "0755"

- name: Copy packages
  ansible.builtin.copy:
    src: "{{ artifacts_dir }}/{{ item }}"
    dest: "{{ remote_artifacts_dir }}/{{ item }}"
    mode: "0644"
  loop: ["{{ opensearch_deb }}", "{{ opensearch_exporter_zip }}"]

# демо-конфигурация безопасности (самоподписанные сертификаты, пользователь admin) не нужна:
# сертификаты свои, пользователи создаются после запуска кластера
- name: Install opensearch
  ansible.builtin.apt:
    deb: "{{ remote_artifacts_dir }}/{{ opensearch_deb }}"
  environment:
    DISABLE_INSTALL_DEMO_CONFIG: "true"

- name: Hold opensearch
  ansible.builtin.dpkg_selections:
    name: opensearch
    selection: hold

- name: Certificates dir
  ansible.builtin.file:
    path: "{{ opensearch_conf_dir }}/certs"
    state: directory
    owner: opensearch
    group: opensearch
    mode: "0750"

- name: Certificates
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item.src }}"
    dest: "{{ opensearch_conf_dir }}/certs/{{ item.dest }}"
    owner: opensearch
    group: opensearch
    mode: "{{ item.mode }}"
  loop:
    - {src: ca.pem, dest: ca.pem, mode: "0644"}
    - {src: "{{ inventory_hostname }}.pem", dest: node.pem, mode: "0644"}
    - {src: "{{ inventory_hostname }}.key", dest: node.key, mode: "0600"}
    - {src: admin.pem, dest: admin.pem, mode: "0644"}
    - {src: admin.key, dest: admin.key, mode: "0600"}
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart opensearch

- name: Remove demo certificates
  ansible.builtin.file:
    path: "{{ opensearch_conf_dir }}/{{ item }}"
    state: absent
  loop: [esnode.pem, esnode-key.pem, kirk.pem, kirk-key.pem, root-ca.pem]

- name: JVM heap
  ansible.builtin.copy:
    dest: "{{ opensearch_conf_dir }}/jvm.options.d/heap.options"
    owner: root
    group: opensearch
    mode: "0640"
    content: |
      -Xms{{ opensearch_heap }}
      -Xmx{{ opensearch_heap }}
  notify: Restart opensearch

- name: Config opensearch.yml
  ansible.builtin.template:
    src: opensearch.yml.j2
    dest: "{{ opensearch_conf_dir }}/opensearch.yml"
    owner: root
    group: opensearch
    mode: "0640"
  notify: Restart opensearch

# индекс безопасности создаётся из этих файлов при первом запуске кластера;
# демо-пользователей с известными паролями в нём быть не должно
- name: Empty internal users
  ansible.builtin.copy:
    dest: "{{ opensearch_conf_dir }}/opensearch-security/internal_users.yml"
    owner: root
    group: opensearch
    mode: "0640"
    content: |
      ---
      _meta:
        type: "internalusers"
        config_version: 2

- name: Prometheus exporter plugin
  ansible.builtin.command:
    cmd: >-
      {{ opensearch_home }}/bin/opensearch-plugin install --batch
      file://{{ remote_artifacts_dir }}/{{ opensearch_exporter_zip }}
    creates: "{{ opensearch_home }}/plugins/prometheus-exporter"
  notify: Restart opensearch

- name: Systemd drop-in dir
  ansible.builtin.file:
    path: /etc/systemd/system/opensearch.service.d
    state: directory
    mode: "0755"

- name: Systemd drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/opensearch.service.d/override.conf
    mode: "0644"
    content: |
      [Service]
      Restart=on-failure
      RestartSec=10
      LimitMEMLOCK=infinity
  notify: Restart opensearch

- name: Enable and start opensearch
  ansible.builtin.systemd_service:
    name: opensearch
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for REST port
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ opensearch_http_port }}"
    timeout: 180
