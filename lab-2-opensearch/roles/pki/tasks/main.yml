---
# Выполняется на управляющей машине: свой CA, сертификаты узлов, администратора и Dashboards
- name: PKI dir
  ansible.builtin.file:
    path: "{{ pki_dir }}"
    state: directory
    mode: "0700"

- name: CA key
  community.crypto.openssl_privatekey:
    path: "{{ pki_dir }}/ca.key"
    type: RSA
    size: 4096

- name: CA CSR
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ pki_dir }}/ca.key"
    common_name: "{{ pki_org }} root CA"
    organization_name: "{{ pki_org }}"
    basic_constraints: ["CA:TRUE"]
    basic_constraints_critical: true
    key_usage: [keyCertSign, cRLSign]
    key_usage_critical: true
  register: pki_ca_csr
  changed_when: false

- name: CA certificate
  community.crypto.x509_certificate:
    path: "{{ pki_dir }}/ca.pem"
    csr_content: "{{ pki_ca_csr.csr }}"
    privatekey_path: "{{ pki_dir }}/ca.key"
    provider: selfsigned
    selfsigned_not_after: "+3650d"

- name: Certificates
  ansible.builtin.include_tasks: cert.yml
  loop: "{{ pki_certs }}"
  loop_control:
    loop_var: cert
    label: "{{ cert.name }}"
