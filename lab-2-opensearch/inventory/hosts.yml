---
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars:
    ansible_user: ubuntu
  children:
    opensearch:
      children:
        hot:
          hosts:
            os-hot-1: {ansible_host: 192.168.252.8}
            os-hot-2: {ansible_host: 192.168.252.7}
        warm:
          hosts:
            os-warm-1: {ansible_host: 192.168.252.5}
    ops:
      hosts:
        os-ops: {ansible_host: 192.168.252.6}
    lab:
      children:
        opensearch:
        ops:
