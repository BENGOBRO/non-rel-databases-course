# Redis как кэш перед PostgreSQL.

bind 0.0.0.0
port 6379
protected-mode yes
tcp-keepalive 60
timeout 300

# Пользователи и права — в users.acl (генерирует entrypoint.sh из переменных окружения)
aclfile /data/users.acl

# Память: жёсткий предел и вытеснение по частоте обращений.
# Популярные товары остаются в кэше, редкие вытесняются первыми.
maxmemory 64mb
maxmemory-policy allkeys-lfu
maxmemory-samples 10
lfu-log-factor 10
lfu-decay-time 1
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-user-del yes

# Персистентность не нужна: источник истины — PostgreSQL, кэш прогревается заново.
save ""
appendonly no

# Диагностика
slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 10
latency-tracking yes
latency-tracking-info-percentiles 50 99 99.9

maxclients 1000
loglevel notice
