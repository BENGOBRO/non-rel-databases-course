name: redis-lab

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:18.7
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?}
      PG_EXPORTER_PASSWORD: ${PG_EXPORTER_PASSWORD:?}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - track_io_timing=on
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U catalog_owner -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s
    deploy:
      resources:
        limits: {cpus: "2", memory: 1g}

  redis:
    <<: *restart
    image: redis:8.10.3
    entrypoint: ["/usr/local/bin/lab-entrypoint.sh"]
    environment:
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:?}
      REDIS_APP_PASSWORD: ${REDIS_APP_PASSWORD:?}
      REDIS_EXPORTER_PASSWORD: ${REDIS_EXPORTER_PASSWORD:?}
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/entrypoint.sh:/usr/local/bin/lab-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user admin --pass \"$$REDIS_ADMIN_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "1", memory: 256m}

  app:
    <<: *restart
    build: ./app
    image: redis-lab/catalog-app:1.0
    environment:
      DATABASE_URL: postgresql://catalog_app:${PG_APP_PASSWORD}@postgres:5432/catalog
      REDIS_URL: redis://app:${REDIS_APP_PASSWORD}@redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      PRODUCT_TTL: "300"
      CATEGORY_TTL: "60"
      NEGATIVE_TTL: "30"
      DB_POOL_SIZE: "10"
    ports:
      - "127.0.0.1:8001-8004:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      replicas: ${APP_REPLICAS:-2}
      resources:
        limits: {cpus: "1", memory: 256m}

  redis-exporter:
    <<: *restart
    image: oliver006/redis_exporter:v1.97.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_USER: exporter
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD:?}
    depends_on:
      redis: {condition: service_healthy}

  postgres-exporter:
    <<: *restart
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/catalog?sslmode=disable
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS: ${PG_EXPORTER_PASSWORD:?}
    depends_on:
      postgres: {condition: service_healthy}

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    <<: *restart
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/redis-cache.json
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${RENDERER_TOKEN:?}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

  # Нагрузочный тест: docker compose --profile loadtest run --rm k6 run /scripts/catalog.js
  k6:
    image: grafana/k6:2.4.0
    profiles: [loadtest]
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),max
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
      BASE_URL: http://app:8000
    volumes:
      - ./loadtest:/scripts:ro
      - ./loadtest/results:/results

  # Снимки панелей Grafana для отчёта: docker compose --profile screenshots up -d renderer
  renderer:
    image: grafana/grafana-image-renderer:v5.12.11
    profiles: [screenshots]
    environment:
      AUTH_TOKEN: ${RENDERER_TOKEN:?}
      BROWSER_MAX_HEIGHT: "6000"

volumes:
  pgdata:
  promdata:
  grafanadata:
