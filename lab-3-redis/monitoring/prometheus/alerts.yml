groups:
  - name: redis-cache
    rules:
      - alert: RedisDown
        expr: redis_up == 0 or absent(redis_up)
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: Redis недоступен — приложение работает напрямую с PostgreSQL

      - alert: RedisMemoryNearLimit
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.95
        for: 1m
        labels: {severity: info}
        annotations:
          summary: Кэш заполнен на {{ $value | humanizePercentage }}, идёт вытеснение

      - alert: RedisHighEvictionRate
        expr: rate(redis_evicted_keys_total[1m]) > 100
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Вытесняется {{ $value | humanize }} ключей/с — кэшу мало памяти

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[1m]) > 0
        labels: {severity: warning}
        annotations:
          summary: Redis отклоняет подключения (maxclients)

      - alert: CacheHitRatioLow
        expr: |
          sum(rate(app_cache_requests_total{result="hit"}[2m]))
            / sum(rate(app_cache_requests_total{result=~"hit|miss"}[2m])) < 0.8
          and sum(rate(app_cache_requests_total[2m])) > 10
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Доля попаданий в кэш {{ $value | humanizePercentage }}

      - alert: CacheErrors
        expr: sum(rate(app_cache_errors_total[1m])) > 0
        for: 15s
        labels: {severity: warning}
        annotations:
          summary: Приложение получает ошибки Redis и обходит кэш

  - name: app
    rules:
      - alert: AppInstanceDown
        expr: up{job="app"} == 0
        for: 15s
        labels: {severity: critical}

      - alert: AppHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(app_http_request_duration_seconds_bucket[1m]))) > 0.1
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: p95 задержки API {{ $value | humanizeDuration }}

      - alert: AppErrorRate
        expr: |
          sum(rate(app_http_requests_total{status=~"5.."}[1m])) / sum(rate(app_http_requests_total[1m])) > 0.01
        for: 1m
        labels: {severity: critical}

      - alert: PostgresDown
        expr: pg_up == 0
        for: 15s
        labels: {severity: critical}
